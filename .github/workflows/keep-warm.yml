# Two jobs in one. Supabase's Free plan pauses a project after 7 days with no
# API requests, and every unpause is a multi-minute "restoring" window; pinging
# every 3 hours means that clock never runs out. The red-run alert is the more
# useful half: it is how you find out the API is unhealthy without a user
# telling you.
#
# Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository variables
# (Settings > Secrets and variables > Actions > Variables) before enabling
# this workflow, or point it at a paid Supabase plan and delete it instead.
#
# GitHub disables scheduled workflows after 60 days with no repo commits, and
# cron runs can be delayed by up to about 15 minutes. The 3-hour interval
# leaves wide margin under the 7-day limit either way.
name: keep-warm

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST and Auth
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          base="$SUPABASE_URL"
          # The publishable key: the same public, row-level-security-protected
          # key already shipped in the website's JavaScript bundle. Not a secret.
          key="$SUPABASE_PUBLISHABLE_KEY"
          fail=0
          for path in "/rest/v1/bonks?select=id&limit=1" "/auth/v1/health"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$base$path" -H "apikey: $key")
            echo "$path -> $code"
            case "$code" in
              2*|3*|401|404) ;;
              *) fail=1 ;;
            esac
          done
          # A red run here is the early warning that the project has paused or
          # gone unhealthy again.
          exit $fail
